<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Woodland Cafe</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1a17;
        overflow: hidden;
        /* Stops double-tap zoom / scroll gestures from stealing taps on mobile. */
        touch-action: none;
      }
      /* Phaser's FIT mode sizes the canvas to fit this element. */
      #game {
        width: 100%;
        height: 100%;
      }
      /* Browsers smooth scaled canvases by default; this keeps pixels sharp. */
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
